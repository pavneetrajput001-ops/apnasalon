  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Rozha+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #050505; /* Deep base color */
    }
    .hindi-title {
      font-family: 'Yatra One', cursive;
    }
    .glass-card {
      background: rgba(18, 12, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    
    /* Apple Music / macOS Style Glass Dock Bar */
    .macos-player {
      background: rgba(24, 20, 18, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Sleek macOS Style Range Sliders */
    input[type=range].mac-slider {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      height: 4px;
      border-radius: 4px;
      transition: height 0.15s ease;
    }

    input[type=range].mac-slider:hover {
      height: 6px;
    }

    input[type=range].mac-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      background: #ffffff;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    input[type=range].mac-slider:hover::-webkit-slider-thumb {
      opacity: 1;
      transform: scale(1.1);
    }

    /* 🌟 Dynamic Background Layers Setup 🌟 */
    .dynamic-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .dynamic-bg.active {
      opacity: 1;
    }
  </style>
</head>

        <button data-key="purane" onclick="selectCategory('purane')" class="cat-btn hover:bg-amber-500/20 text-amber-100 px-4 py-1.5 rounded-full text-xs transition whitespace-nowrap">

  <!-- Hero Content -->

      सुनो ज़रा

      <!-- Left: Thumbnail & Song Info -->

        <div class="flex items-center space-x-5">
          <button onclick="prevSong()" title="Previous Song" class="text-white/70 hover:text-white transition text-base">
            ⏮
          </button>
          <button id="play-btn" onclick="togglePlay()" class="w-9 h-9 rounded-full bg-white text-stone-950 font-bold flex items-center justify-center transition hover:scale-105 shadow-md text-sm">
            ▶
          </button>
          <button onclick="nextSong()" title="Next Song" class="text-white/70 hover:text-white transition text-base">
            ⏭
          </button>
        </div>

        <!-- Progress Tracker Bar -->
        <div class="flex items-center space-x-2.5 w-full">
          <span id="current-time" class="text-[10px] text-white/50 font-mono w-8 text-right">00:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" oninput="seekTo(this.value)" class="mac-slider flex-1 cursor-pointer">
          <span id="total-duration" class="text-[10px] text-white/50 font-mono w-8 text-left">00:00</span>
        </div>
      </div>

      <!-- Right: Volume or Extra Action Placeholder -->
      <div class="hidden sm:flex items-center justify-end space-x-3 w-1/4 text-white/60 text-xs">
        <span class="text-[11px] font-medium text-white/40 tracking-wider"> AUDIO</span>
      </div>

    </div>

    <!-- CONTACT EMAIL DIRECTLY BELOW MUSIC BAR -->
    <div class="mt-2 text-center">
      <a href="mailto:contact@apnasalonradio.com" class="text-[11px] text-amber-200/60 hover:text-amber-400 transition flex items-center justify-center gap-1">
        <span>✉️</span>
        <span>contact@apnasalonradio.com</span>
      </a>
    </div>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  
  <script>
    let player;
    let isPlaying = false;
    let isPlayerReady = false;
    let seekInterval = null;

    const MY_CHANNEL_URL = "https://music.youtube.com/@pavneetrajput2589";
    document.getElementById('yt-channel-link').href = MY_CHANNEL_URL;

    const MY_PLAYLIST_ID = "PL_HFpdcZhoSHU-NhkhAlZC8GvSnMMCH_J";
    const MY_PLAYLIST_ID_salon = "PL_HFpdcZhoSHU-NhkhAlZC8GvSnMMCH_J";
    const MY_PLAYLIST_ID_purane = "PL_HFpdcZhoSGDrYxUBJLH6ccbSeYBAPmf";
    const MY_PLAYLIST_ID_kishore = "PLP7ERBVXGUZ8";

    // All Categories (Kishor Daa added with playlist reference)
    const categories = {
      'salon': { name: "सैलून हिट्स", cat: "Category: सैलून हिट्स", tagline: '"सैलून की महफ़िल और सदाबहार नग़मों की शाम..."', playlistId: MY_PLAYLIST_ID_salon, bgId: 'bg-salon' },
      'purane': { name: "ओल्ड इज़ गोल्ड", cat: "Category: ओल्ड इज़ गोल्ड", tagline: '"वही पुराना टेप... वही सदाबहार नग़मे"', playlistId: MY_PLAYLIST_ID_purane, bgId: 'bg-vintage' },
      'kishor': { name: "किशोर दा", cat: "Category: किशोर दा", tagline: '"किशोर कुमार की जादुई आवाज़ और अनमोल तराने..."', playlistId: MY_PLAYLIST_ID_kishore, bgId: 'bg-vintage' },
      'safar': { name: "सफ़र", cat: "Category: सफ़र", tagline: '"सफ़र में खिलते हैं दिल के फूल..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-night' },
      'chai': { name: "चाय और गाने", cat: "Category: चाय और गाने", tagline: '"शाम की चाय और मीठे तरानें..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      
      // Additional Playlists
      'raat': { name: "रात के गाने", cat: "Category: रात के गाने", tagline: '"रात का सफ़र और पुराने गानों का हमसफ़र..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      'sad': { name: "दर्द भरे नग़मे", cat: "Category: दर्द भरे नग़मे", tagline: '"टूटे दिल की सदा... मीठे दर्द का एहसास"', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      'romantic': { name: "रोमांस हिट्स", cat: "Category: रोमांस हिट्स", tagline: '"प्यार के नग़मे, मोहब्बत की बातें..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      'ghazal': { name: "ग़ज़ल संग्रह", cat: "Category: ग़ज़ल संग्रह", tagline: '"ग़ज़लों का सुहाना सफ़र..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      'devotional': { name: "भक्ति संध्या", cat: "Category: भक्ति संध्या", tagline: '"मन की शांति और भक्ति के सुर..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' },
      'monsoon': { name: "बारिश के गीत", cat: "Category: बारिश के गीत", tagline: '"रिमझिम के तराने और पुरानी यादें..."', playlistId: MY_PLAYLIST_ID, bgId: 'bg-salon' }
    };

    let currentCategoryKey = 'salon';

    // 1. REAL-TIME CLOCK FUNCTIONALITY (24-HOUR FORMAT)
    function startClock() {
      function updateTime() {
        const now = new Date();
        document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
      }
      updateTime();
      setInterval(updateTime, 1000);
    }
    startClock();

    // 2. LIVE LISTENERS COUNTER
    let listenerCount = Math.floor(Math.random() * 50) + 180;
    document.getElementById('live-listeners').textContent = listenerCount;

    setInterval(() => {
      const change = Math.floor(Math.random() * 7) - 3;
      listenerCount = Math.max(120, listenerCount + change);
      document.getElementById('live-listeners').textContent = listenerCount;
    }, 4000);

    function toggleFoldMenu() {
      const menu = document.getElementById('unfold-menu');
      const icon = document.getElementById('fold-icon');
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
      } else {
        menu.classList.add('hidden');
        icon.style.transform = 'rotate(0deg)';
      }
    }

    // YOUTUBE LOGIC
    function onYouTubeIframeAPIReady() {
      const randomIndex = Math.floor(Math.random() * 15);

      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          'listType': 'playlist',
          'list': categories[currentCategoryKey].playlistId,
          'index': randomIndex,
          'shufflePlaylist': 1,
          'autoplay': 0,
          'controls': 0,
          'playsinline': 1,
          'origin': window.location.origin || '*'
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      isPlayerReady = true;
      if (player && player.setShuffle) {
        player.setShuffle(true);
      }

      const randomIndex = Math.floor(Math.random() * 15);
      player.cuePlaylist({
        listType: 'playlist',
        list: categories[currentCategoryKey].playlistId,
        index: randomIndex
      });
    }

    function onPlayerError(event) {
      console.error("YouTube Player Error Code:", event.data);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayButtonState(true);
        updateSongInfo();
        startProgressTimer();
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED || event.data === YT.PlayerState.CUED) {
        isPlaying = false;
        updatePlayButtonState(false);
        stopProgressTimer();
        if (event.data === YT.PlayerState.CUED) {
          updateSongInfo();
        }
      }
    }

    function updateSongInfo() {
      if (player && player.getVideoData) {
        const videoData = player.getVideoData();
        if (videoData && videoData.title) {
          document.getElementById('song-title').textContent = videoData.title;
        }
        if (videoData && videoData.video_id) {
          document.getElementById('song-thumbnail').src = `https://img.youtube.com/vi/${videoData.video_id}/hqdefault.jpg`;
        }
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateSeekBarFill(percent) {
      const seekBar = document.getElementById('seek-bar');
      seekBar.value = percent;
      seekBar.style.background = `linear-gradient(to right, #ffffff 0%, #ffffff ${percent}%, rgba(255,255,255,0.15) ${percent}%, rgba(255,255,255,0.15) 100%)`;
    }

    function startProgressTimer() {
      stopProgressTimer();
      seekInterval = setInterval(() => {
        if (player && player.getCurrentTime && player.getDuration) {
          const currentTime = player.getCurrentTime();
          const duration = player.getDuration();
          if (duration > 0) {
            const percent = (currentTime / duration) * 100;
            updateSeekBarFill(percent);
            document.getElementById('current-time').textContent = formatTime(currentTime);
            document.getElementById('total-duration').textContent = formatTime(duration);
          }
        }
      }, 500);
    }

    function stopProgressTimer() {
      if (seekInterval) clearInterval(seekInterval);
    }

    function seekTo(percent) {
      if (player && player.getDuration) {
        const duration = player.getDuration();
        const seekSeconds = (percent / 100) * duration;
        player.seekTo(seekSeconds, true);
        updateSeekBarFill(percent);
        document.getElementById('current-time').textContent = formatTime(seekSeconds);
      }
    }

    function togglePlay() {
      if (!isPlayerReady) return;

      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function updatePlayButtonState(playing) {
      document.getElementById('play-btn').textContent = playing ? '⏸' : '▶';
    }

    function updateUI() {
      const catObj = categories[currentCategoryKey];
  
      // --- BACKGROUND SWAPPING LOGIC ---
      document.querySelectorAll('.dynamic-bg').forEach(bg => {
        bg.classList.remove('active');
      });
      
      const targetBg = document.getElementById(catObj.bgId);
      if (targetBg) {
        targetBg.classList.add('active');
      }

      // Update active button styles
      document.querySelectorAll('.cat-btn, .extra-cat-btn').forEach(b => {
        b.classList.remove('bg-amber-500', 'text-stone-950', 'font-bold', 'shadow-lg');
        b.classList.add('text-amber-100', 'hover:bg-amber-500/20');
      });

      const activeBtn = document.querySelector(`[data-key="${currentCategoryKey}"]`);
      if (activeBtn) {
        activeBtn.classList.add('bg-amber-500', 'text-stone-950', 'font-bold', 'shadow-lg');
        activeBtn.classList.remove('text-amber-100', 'hover:bg-amber-500/20');
      }

      // Update text elements on the page
      document.getElementById('song-category').textContent = catObj.cat;
      document.getElementById('tagline').textContent = catObj.tagline;

      // Instant single-click playlist switch handler
      if (isPlayerReady && player) {
        const randomIndex = Math.floor(Math.random() * 10);
    
        // Stop current stream immediately to clear buffer lock
        player.stopVideo();
    
        // Load new playlist and play instantly
        setTimeout(() => {
          player.loadPlaylist({
            listType: 'playlist',
            list: catObj.playlistId,
            index: randomIndex
          });
          player.playVideo();
        }, 50);
      }
    }
    
    function selectCategory(key) {
      currentCategoryKey = key;
      updateUI();
    }

    function prevSong() {
      if (isPlayerReady && player.previousVideo) {
        player.previousVideo();
      }
    }

    function nextSong() {
      if (isPlayerReady && player.nextVideo) {
        player.nextVideo();
      }
    }
  </script>
</body>
</html>
